name: Informe de error
description: Reportar un defecto o comportamiento inesperado
title: "[error]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Gracias por informar un error. Complete los campos siguientes.
        Si se trata de una vulnerabilidad de seguridad, use la [política de seguridad](https://github.com/andrescardona7/.github/blob/main/SECURITY.md) en lugar de un issue público.
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Descripción breve del problema.
      placeholder: Qué ocurre y en qué contexto.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Lista numerada de pasos.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería ocurrir.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué ocurre en realidad.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Sistema operativo, versiones relevantes u otra información útil.
      placeholder: SO, versión de Node/runtime, navegador, etc.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Información adicional
      description: Registros, capturas o enlaces relevantes (sin secretos).
    validations:
      required: false
